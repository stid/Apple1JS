name: Tests CI

on: [push, pull_request]

# Least privilege: the only write this workflow needs is posting the `tests`
# commit status (the curl steps below). Everything else is read-only.
permissions:
    contents: read
    statuses: write

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: yarn

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Cache Rust dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      wasm-cpu/target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Install wasm-pack
              # ~/.cargo/bin is cached, so check the version, not just presence:
              # a restored older binary would otherwise never be replaced.
              env:
                  WASM_PACK_VERSION: 0.15.1
              run: |
                  if ! wasm-pack --version 2>/dev/null | grep -q "$WASM_PACK_VERSION"; then
                      rm -f ~/.cargo/bin/wasm-pack
                      curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh
                  fi
                  wasm-pack --version

            - name: Build WASM module
              # Release, not --dev: build what `yarn dev` and production ship, so a
              # wasm-opt or release-profile breakage fails here instead of on deploy.
              run: |
                  cd wasm-cpu
                  wasm-pack build --release --target web --out-dir ../src/wasm

            - name: Rust tests
              # Native: the CPU core runs against stand-ins for the JS imports.
              run: cd wasm-cpu && cargo test

            - name: Install JS dependencies
              run: yarn install --frozen-lockfile

            - name: Run tests
              run: yarn test:ci

            - name: Coverage thresholds
              run: yarn test:coverage

            - name: Production build
              # tsc already ran in test:ci; this exercises the bundler (Rolldown,
              # terser, Tailwind), which the test gate never touches.
              run: yarn vite:build

            - name: Tests ✅
              if: ${{ success() }}
              run: |
                  curl --request POST \
                  --url https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
                  --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
                  --header 'content-type: application/json' \
                  --data '{
                    "context": "tests",
                    "state": "success",
                    "description": "Tests passed",
                    "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }'

            - name: Tests 🚨
              if: ${{ failure() }}
              run: |
                  curl --request POST \
                  --url https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }} \
                  --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' \
                  --header 'content-type: application/json' \
                  --data '{
                    "context": "tests",
                    "state": "failure",
                    "description": "Tests failed",
                    "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }'
